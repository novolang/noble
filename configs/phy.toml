# A Host that reports the PHY of its links (`phy_events`) and writes LE Set Default PHY (`default_phy`) and LE Write Suggested Default Data Length (`default_data_length`) at the end of the start-up.  Every suite of the
# package runs under it with `novo config ci`; with the queue of configs/layer_a.toml the cases of tests/host_api_tests.nv that need the PHY are built.
#   novo test --config configs/phy.toml tests/host_api_tests.nv
[noble]
phy_events = 1
default_phy = 3
default_data_length = 251
max_connections = 2
event_queue = 4
